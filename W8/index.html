<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Event Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="h3 mb-3">Event Registration</h1>

    <form class="needs-validation" novalidate>
      <div class="row g-3">
        <div class="col-md-6 form-floating">
          <input type="text" class="form-control" id="name" placeholder="Full Name" required />
          <label for="name">Full Name</label>
          <div class="invalid-feedback">Name is required.</div>
        </div>
        <div class="col-md-6 form-floating">
          <input type="email" class="form-control" id="email" placeholder="Email" required />
          <label for="email">Email</label>
          <div class="invalid-feedback">Valid email required.</div>
        </div>
        <div class="col-md-6 form-floating">
          <input type="tel" class="form-control" id="phone" placeholder="Phone" required />
          <label for="phone">Phone</label>
          <div class="invalid-feedback">Phone is required.</div>
        </div>
        <div class="col-md-6 form-floating">
          <input type="text" class="form-control" id="city" placeholder="City" required />
          <label for="city">City</label>
          <div class="invalid-feedback">City is required.</div>
        </div>
        <div class="col-12">
          <label class="form-label">Ticket Type</label>
          <select class="form-select" data-bs-toggle="tooltip" data-bs-title="Choose ticket type" required>
            <option value="">Select</option>
            <option>Standard</option>
            <option>VIP</option>
          </select>
          <div class="invalid-feedback">Select a ticket type.</div>
        </div>
        <div class="col-12">
          <label class="form-label">Notes</label>
          <textarea class="form-control" rows="3" data-bs-toggle="tooltip" data-bs-title="Any special requirements"></textarea>
        </div>
      </div>

      <button class="btn btn-primary mt-3" type="submit">Register</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const tooltips = document.querySelectorAll('[data-bs-toggle="tooltip"]');
    tooltips.forEach((el) => new bootstrap.Tooltip(el));

    const form = document.querySelector('.needs-validation');
    form.addEventListener('submit', (e) => {
      if (!form.checkValidity()) {
        e.preventDefault();
        e.stopPropagation();
      }
      form.classList.add('was-validated');
    });
  </script>
</body>
</html>
