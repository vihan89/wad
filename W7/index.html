<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Facebook - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f0f2f5; }
    .box { background: #fff; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="row g-4">
      <div class="col-lg-5">
        <h1 class="text-primary fw-bold">facebook</h1>
        <p>Connect with friends and the world around you.</p>
        <div class="box p-3">
          <input class="form-control mb-2" placeholder="Email or Username" />
          <input class="form-control mb-2" type="password" placeholder="Password" />
          <button class="btn btn-primary w-100 mb-2">Login</button>
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="keep" />
            <label class="form-check-label" for="keep">Keep me logged in</label>
          </div>
          <a href="#" class="small">Forgotten my password</a>
        </div>
      </div>

      <div class="col-lg-7">
        <div class="box p-3">
          <h4 class="mb-3">Create an Account</h4>
          <div class="row g-2">
            <div class="col-md-6"><input class="form-control" placeholder="Firstname" /></div>
            <div class="col-md-6"><input class="form-control" placeholder="Lastname" /></div>
            <div class="col-12"><input class="form-control" placeholder="Email" /></div>
            <div class="col-12"><input class="form-control" placeholder="Re-enter email" /></div>
            <div class="col-12"><input class="form-control" type="password" placeholder="Password" /></div>
            <div class="col-12"><input class="form-control" placeholder="Date (dd/mm/yyyy)" /></div>
            <div class="col-12">
              <label class="form-label">Gender</label>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="male" />
                <label class="form-check-label" for="male">Male</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="gender" id="female" />
                <label class="form-check-label" for="female">Female</label>
              </div>
            </div>
          </div>
          <button class="btn btn-success mt-3">Signup</button>
          <p class="small mt-2">Create a page for you.</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
