<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Art Gallery</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <h1>City Art Gallery</h1>
    <p>Welcome to our small collection of modern art.</p>

    <div class="grid">
      <div class="card">
        <img src="https://via.placeholder.com/220x140?text=Art+1" alt="Art 1" />
        <h3>Blue Horizon</h3>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/220x140?text=Art+2" alt="Art 2" />
        <h3>Warm Lines</h3>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/220x140?text=Art+3" alt="Art 3" />
        <h3>Forest Light</h3>
      </div>
    </div>
  </div>
</body>
</html>
