<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>E-Commerce Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body { background: #f6f7f9; }
    .card img { height: 160px; object-fit: cover; }
  </style>
</head>
<body>
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Product Listing</h1>
      <div class="dropdown">
        <button class="btn btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown">
          Filter Category
        </button>
        <ul class="dropdown-menu" id="filterMenu">
          <li><a class="dropdown-item" data-filter="all" href="#">All</a></li>
          <li><a class="dropdown-item" data-filter="audio" href="#">Audio</a></li>
          <li><a class="dropdown-item" data-filter="wearable" href="#">Wearable</a></li>
          <li><a class="dropdown-item" data-filter="accessory" href="#">Accessory</a></li>
        </ul>
      </div>
    </div>

    <div class="row g-3" id="productGrid">
      <div class="col-12 col-sm-6 col-lg-4" data-category="audio">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200?text=Headphones" class="card-img-top" alt="Headphones">
          <div class="card-body">
            <h5 class="card-title">Headphones</h5>
            <p class="card-text">INR 7,999</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4" data-category="wearable">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200?text=Smartwatch" class="card-img-top" alt="Smartwatch">
          <div class="card-body">
            <h5 class="card-title">Smartwatch</h5>
            <p class="card-text">INR 12,999</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4" data-category="accessory">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200?text=Mouse" class="card-img-top" alt="Gaming Mouse">
          <div class="card-body">
            <h5 class="card-title">Gaming Mouse</h5>
            <p class="card-text">INR 2,499</p>
          </div>
        </div>
      </div>
      <div class="col-12 col-sm-6 col-lg-4" data-category="accessory">
        <div class="card h-100">
          <img src="https://via.placeholder.com/300x200?text=Stand" class="card-img-top" alt="Laptop Stand">
          <div class="card-body">
            <h5 class="card-title">Laptop Stand</h5>
            <p class="card-text">INR 1,999</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const menu = document.getElementById("filterMenu");
    const cards = document.querySelectorAll("#productGrid [data-category]");

    menu.addEventListener("click", (e) => {
      if (e.target.dataset.filter) {
        const filter = e.target.dataset.filter;
        cards.forEach((card) => {
          const match = filter === "all" || card.dataset.category === filter;
          card.classList.toggle("d-none", !match);
        });
      }
    });
  </script>
</body>
</html>
